<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>داریوش | سرزمین ساسانیان</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#171717;
 color:white;
 font-family:Tahoma,sans-serif;
 touch-action:none;
}
#game{
 position:fixed;
 inset:0;
}
canvas{display:block}
#top{
 position:absolute;
 top:10px;
 right:10px;
 left:10px;
 display:flex;
 justify-content:space-between;
 gap:7px;
 pointer-events:none;
}
.stat{
 background:#21180ddc;
 border:1px solid #b58a4b;
 padding:9px;
 border-radius:9px;
 font-size:12px;
}
#message{
 position:absolute;
 top:65px;
 left:50%;
 transform:translateX(-50%);
 background:#171717d9;
 padding:10px 15px;
 border-radius:10px;
 text-align:center;
 font-size:12px;
 width:85%;
 max-width:400px;
}
#controls{
 position:absolute;
 bottom:20px;
 right:15px;
 display:grid;
 grid-template-columns:55px 55px 55px;
 gap:7px;
}
button{
 border:1px solid #c69b57;
 border-radius:12px;
 background:#543a20eF;
 color:white;
 font-size:18px;
 padding:13px;
 touch-action:none;
}
button:active{background:#a17437}
#up{grid-column:2}
#left{grid-column:1}
#down{grid-column:2}
#right{grid-column:3}
#actions{
 position:absolute;
 bottom:25px;
 left:12px;
 display:flex;
 flex-direction:column;
 gap:8px;
}
#actions button{
 font-size:12px;
 padding:12px 14px;
}
#look{
 position:absolute;
 inset:0;
 pointer-events:none;
}
#hint{
 position:absolute;
 bottom:5px;
 left:50%;
 transform:translateX(-50%);
 font-size:10px;
 color:#fff;
 background:#0008;
 padding:5px 10px;
 border-radius:8px;
 white-space:nowrap;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="top">
 <div class="stat">❤️ سلامت: <span id="health">100</span></div>
 <div class="stat">🪙 سکه: <span id="coins">50</span></div>
 <div class="stat">🛡 رتبه: سرباز</div>
</div>

<div id="message">
 به بیشاپور خوش آمدی، داریوش!
</div>

<div id="controls">
 <button id="up">▲</button>
 <button id="left">◀</button>
 <button id="down">▼</button>
 <button id="right">▶</button>
</div>

<div id="actions">
 <button onclick="talk()">💬 صحبت</button>
 <button onclick="rest()">🛏 استراحت</button>
 <button onclick="mission()">📜 مأموریت</button>
</div>

<div id="hint">برای چرخاندن دوربین، انگشتت را روی صفحه بکش</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d0df);
scene.fog = new THREE.Fog(0xb9d0df,25,100);

const camera = new THREE.PerspectiveCamera(
 75,window.innerWidth/window.innerHeight,0.1,200
);
camera.position.set(0,1.7,8);

const renderer = new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe4bd,0x57432d,2));

const sunlight=new THREE.DirectionalLight(0xffe0aa,2.5);
sunlight.position.set(-10,20,10);
sunlight.castShadow=true;
scene.add(sunlight);

function material(color){
 return new THREE.MeshStandardMaterial({
  color,
  roughness:0.9
 });
}

function cube(x,y,z,w,h,d,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(color)
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

// زمین
cube(0,-0.3,0,200,0.5,200,0x9c8059);

// مسیر سنگی
for(let i=0;i<15;i++){
 cube(0,-0.02,-i*4,3,0.08,3,0xb6a080);
}

// کوه‌ها
function mountain(x,z,size,color){
 const mesh=new THREE.Mesh(
  new THREE.ConeGeometry(size, size*1.4,4),
  material(color)
 );
 mesh.position.set(x,size*.55,z);
 mesh.rotation.y=Math.PI/4;
 scene.add(mesh);
}
mountain(-25,-35,15,0x74604c);
mountain(25,-40,18,0x89715a);
mountain(-40,-75,23,0x675744);
mountain(40,-85,25,0x78634b);

// دیوارهای شهر
cube(-12,2,-25,1,4,65,0x9b7049);
cube(12,2,-25,1,4,65,0x9b7049);
cube(0,2,-58,25,4,1,0x9b7049);

// برج‌های شهر
function tower(x,z){
 cube(x,3,z,4,6,4,0xa87b4d);
 cube(x,6.2,z,4.5,.5,4.5,0x75502f);
 for(let i=-1;i<=1;i++){
  cube(x+i*1.3,6.7,z,0.45,.6,.45,0xc29b65);
 }
}
tower(-12,-10);
tower(12,-10);
tower(-12,-48);
tower(12,-48);

// خانه‌های ساسانی
function house(x,z){
 cube(x,1.5,z,7,3,7,0xc18b55);
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(5,2,4),
  material(0x77452e)
 );
 roof.position.set(x,4,z);
 roof.rotation.y=Math.PI/4;
 scene.add(roof);

 cube(x,1,z+3.56,1.4,2,0x54301f);
}
house(-7,-17);
house(7,-20);
house(-7,-34);
house(7,-38);
house(0,-48);

// ستون‌های کاخ
for(let i=0;i<5;i++){
 const x=-5+i*2.5;
 cube(x,2,-55,.5,4,.5,0xd0ae76);
 cube(x,4.2,-55,1,.35,1,0x9e7549);
}

// سربازان
function soldier(x,z){
 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.65,1,.4),
  material(0x7b5030)
 );
 body.position.y=1.1;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.28,12,12),
  material(0xc99a70)
 );
 head.position.y=1.85;
 group.add(head);

 const helmet=new THREE.Mesh(
  new THREE.ConeGeometry(.35,.5,8),
  material(0x9b733b)
 );
 helmet.position.y=2.2;
 group.add(helmet);

 const shield=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1,.12),
  material(0x9d6b34)
 );
 shield.position.set(.55,1.1,.05);
 group.add(shield);

 group.position.set(x,0,z);
 scene.add(group);
}
soldier(-3,-12);
soldier(5,-28);
soldier(-5,-42);

// خورشید
const sun=new THREE.Mesh(
 new THREE.SphereGeometry(4,20,20),
 new THREE.MeshBasicMaterial({color:0xffd18a})
);
sun.position.set(-25,30,-75);
scene.add(sun);

// وضعیت بازیکن
let yaw=0;
let pitch=0;
let health=100;
let coins=50;

const keys={};
let touchStart=null;

function setKey(name,value){
 keys[name]=value;
}

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  setKey(key,true);
 });
 b.addEventListener('pointerup',()=>setKey(key,false));
 b.addEventListener('pointerleave',()=>setKey(key,false));
 b.addEventListener('pointercancel',()=>setKey(key,false));
}

bindButton('up','forward');
bindButton('down','back');
bindButton('left','left');
bindButton('right','right');

// چرخاندن دوربین با انگشت
renderer.domElement.addEventListener('pointerdown',e=>{
 touchStart={x:e.clientX,y:e.clientY};
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(!touchStart)return;

 const dx=e.clientX-touchStart.x;
 const dy=e.clientY-touchStart.y;

 yaw-=dx*.004;
 pitch-=dy*.003;

 pitch=Math.max(-1.1,Math.min(1.1,pitch));

 touchStart={x:e.clientX,y:e.clientY};
});

renderer.domElement.addEventListener('pointerup',()=>{
 touchStart=null;
});
renderer.domElement.addEventListener('pointercancel',()=>{
 touchStart=null;
});

// حرکت
function animate(){
 requestAnimationFrame(animate);

 const speed=.12;

 const forward=new THREE.Vector3(
  -Math.sin(yaw),0,-Math.cos(yaw)
 );
 const side=new THREE.Vector3(
  Math.cos(yaw),0,-Math.sin(yaw)
 );

 if(keys.forward)camera.position.addScaledVector(forward,speed);
 if(keys.back)camera.position.addScaledVector(forward,-speed);
 if(keys.left)camera.position.addScaledVector(side,-speed);
 if(keys.right)camera.position.addScaledVector(side,speed);

 camera.position.x=Math.max(-10,Math.min(10,camera.position.x));
 camera.position.z=Math.max(-60,Math.min(10,camera.position.z));

 camera.position.y=1.7;

 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

window.talk=function(){
 document.getElementById('message').innerText=
 'فرمانده: سرباز داریوش! به بیشاپور خوش آمدی. آماده‌ای به سپاه شاهنشاهی بپیوندی؟';
};

window.rest=function(){
 health=Math.min(100,health+20);
 document.getElementById('health').innerText=health;
 document.getElementById('message').innerText=
 'در پادگان استراحت کردی. سلامتت افزایش یافت.';
};

window.mission=function(){
 document.getElementById('message').innerText=
 'مأموریت: به کاخ شهر برو و با فرمانده صحبت کن.';
};
</script>
</body>
</html>
